{% extends "design_system/base.html" %}

{% block ds_title %}Styles – PLOS Design System{% endblock ds_title %}

{% block ds_content %}
  <h1 class="govuk-heading-xl">Styles</h1>
  <ul class="govuk-list">
    {% for style in styles %}
      <li>
        <a href="{{ style.slug }}/" class="govuk-link govuk-body-l">{{ style.label }}</a>
      </li>
    {% endfor %}
  </ul>
{% endblock ds_content %}
