{% extends "design_system/base.html" %}

{% block ds_title %}Patterns – PLOS Design System{% endblock ds_title %}

{% block ds_content %}
  <h1 class="govuk-heading-xl">Patterns</h1>
  <ul class="govuk-list">
    {% for component in components %}
      <li>
        <a href="{{ component.slug }}/" class="govuk-link govuk-body-l">{{ component.label }}</a>
      </li>
    {% endfor %}
  </ul>
{% endblock ds_content %}
