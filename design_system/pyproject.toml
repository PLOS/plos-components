[project]
name = "design-system"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "plos-django-components",
]

[tool.uv.sources]
plos-django-components = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["design_system", "showcase"]
