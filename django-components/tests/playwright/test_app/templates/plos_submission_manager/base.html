<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8" />
    <title>
      {% block title %}
        PLOS
      {% endblock title %}
    </title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0c" />
    <link rel="icon" href="https://ux.plos.org/assets/v3/brand/favicon/favicon.ico">
    <link rel="stylesheet" href="https://ux.plos.org/assets/v3/styles/gov-uk-frontend-v6.min.css" />
    <link rel="stylesheet" href="https://ux.plos.org/assets/v3/styles/plos-overrides.min.css" />
    {% block extra_head %}{% endblock extra_head %}
  </head>
  <body class="govuk-template__body">
    {% block pre_content %}{% endblock pre_content %}
    <div class="govuk-width-container">
      <main class="govuk-main-wrapper" id="main-content">
        {% block content %}
        {% endblock content %}
      </main>
    </div>
    <script>
      document.body.className += " js-enabled";
    </script>

    <script type="module">
      import { initAll } from "https://ux.plos.org/assets/v3/scripts/gov-uk-frontend-v6.min.js";
      document.body.classList.add("govuk-frontend-supported");
      initAll();
    </script>
    {% block js %}{% endblock js %}
  </body>
</html>
