<div id="{{ field_id }}-form-group"
     class="govuk-form-group{% if errors %} govuk-form-group--error{% endif %}">
    <fieldset id="{{ field_id }}-fieldset"
              {% html_attrs attrs %} class="govuk-fieldset"
              {% if hint or errors %}
              aria-describedby="{% if hint %}{{ field_id }}-hint{% endif %}{% if hint and errors %} {% endif %}{% if errors %}{{ field_id }}-error{% endif %}"
              {% endif %}>
        {% if legend %}
        <legend id="{{ field_id }}-legend"
                class="{{ legend_class }}">
            {{ legend|escape }}
        </legend>
        {% endif %}
        {% if hint %}
        <div id="{{ field_id }}-hint" class="govuk-hint">
            {{ hint|escape }}
        </div>
        {% endif %}
        {% component "plos_error_summary" entries=errors %}{% endcomponent %}
        <div class="govuk-checkboxes" data-module="govuk-checkboxes">
            {% for option in item_options %}
            <div class="govuk-checkboxes__item">
                <input class="govuk-checkboxes__input"
                       id="{{ field_id }}{% if not forloop.first %}-{{ forloop.counter }}{% endif %}"
                       name="{{ name }}"
                       type="checkbox"
                       value="{{ option.value }}"
                       {% if option.checked %} checked{% endif %}>
                <label class="govuk-label govuk-checkboxes__label"
                       id="{{ field_id }}{% if not forloop.first %}-{{ forloop.counter }}{% endif %}-label"
                       for="{{ field_id }}{% if not forloop.first %}-{{ forloop.counter }}{% endif %}">
                    {{ option.content }}
                </label>
            </div>
            {% endfor %}
        </div>
    </fieldset>
</div>
