<div class="govuk-form-group{% if errors %} govuk-form-group--error{% endif %}">
    <label class="{{ label_class }}" for="{{ id }}">
        {{ label }}{% if required %}<span class="red">*</span>{% endif %}
    </label>
    {% if hint %}
    <div class="govuk-hint" id="{{id}}-hint">{{ hint }}</div>
    {% endif %}
    {% component "plos_error_summary" entries=errors compact="True" %}{% endcomponent %}
    <div class="govuk-input__wrapper">
        {% if prefix %}
        <div class="govuk-input__prefix" aria-hidden="true">{{ prefix }}</div>
        {% endif %}
        <input type="{{ input_type }}"
               id="{{ id }}"
               name="{{ name }}"
               class="govuk-input{% if errors %} govuk-input--error{% endif %}"
               {% if disabled %}disabled{% endif %}
               {% if autofocus %}autofocus{% endif %}
               {% if value is not None %}value="{{ value }}" {% endif %}
               {% if placeholder %}placeholder="{{ placeholder }}" {% endif %}
               {% if required %}required{% endif %}
               {% if hint or errors %}
               aria-describedby="{% if hint %}{{ id }}-hint{% endif %}{% if hint and errors %} {% endif %}{% if errors %}{{ id }}-error{% endif %}"
               {% endif %}
               {% if maxlength %}maxlength={{ maxlength }}{% endif %}
               {% if minlength %}minlength={{ minlength }}{% endif %}
               {% if step %}step="{{ step }}"{% endif %}>
        {% if suffix %}
        <div class="govuk-input__suffix" aria-hidden="true">{{ suffix }}</div>
        {% endif %}
    </div>

</div>
