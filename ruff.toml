# Allow lines to be as long as 120.
line-length = 120

# Assume Python 3.10
target-version = "py310"

[lint]
# E: pycodestyle errors
# F: Pyflakes
# I: import sorting
# DJ: flake8-django
select = ["E", "F", "I", "DJ"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "*.html"
]
